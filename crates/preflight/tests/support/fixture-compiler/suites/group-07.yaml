version: 1
suite: group-07
adapter: tiny
cases:
  - id: echo
    files: {main.my: 'print group-07'}
    stdin: ' input'
    execute: {mode: compile_and_run, entry: main.my}
    expect:
      compile: {exit_code: 0}
      run: {exit_code: 0, stdout: {exact: 'group-07 input'}}
      files: {result.txt: {exact: 'group-07'}}
  - id: syntax-error
    files: {main.my: invalid}
    execute: {mode: compile, entry: main.my}
    expect:
      compile: {exit_code: 1, stderr: {contains: 'expected print'}}
      diagnostics: {exact: 'error: expected print'}
