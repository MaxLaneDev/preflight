name: Check and package
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      include_deferred:
        description: 'Also run currently deferred Windows/x86_64 targets'
        type: boolean
        default: false
  workflow_call:
    inputs:
      include_deferred:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include_deferred && '["macos-15","ubuntu-24.04-arm","ubuntu-24.04","macos-15-intel","windows-2025"]' || '["macos-15","ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: jq --version
        shell: bash
      - run: cargo fmt --all --check
      - run: cargo clippy --release --locked --workspace --all-targets -- -D warnings
      - run: cargo test --release --locked --workspace
      - run: cargo build --release --locked --workspace
      - run: node --test crates/preflight-client/tests/*.test.mjs
        shell: bash
      - run: sh scripts/test-script-entrypoints.sh
        shell: bash
      - name: Package server with required Web UI and MCP
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          sh scripts/release.sh package --server "target/release/preflight$suffix" --destination dist
      - run: sh scripts/test-without-node.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
