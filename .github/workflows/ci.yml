name: Check and package
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      macos27_only:
        description: 'Check macOS 27 ARM64 compatibility without publishing a second ARM64 archive'
        type: boolean
        default: false
      x86_64_only:
        description: 'Check only Linux x86_64 and Windows x86_64'
        type: boolean
        default: false
      include_deferred:
        description: 'Check all supported release platforms (legacy input)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      macos27_only:
        type: boolean
        default: false
      x86_64_only:
        type: boolean
        default: false
      include_deferred:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.macos27_only && 'macos27' || inputs.x86_64_only && 'x86_64' || inputs.include_deferred && 'all' || 'supported' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos27_only && '["xcode-27"]' || inputs.x86_64_only && '["ubuntu-24.04","windows-2025"]' || '["macos-15","macos-15-intel","ubuntu-24.04-arm","ubuntu-24.04","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Record native Rust host
        run: rustc -vV
      - name: Verify macOS 27 runner identity
        if: inputs.macos27_only
        shell: bash
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d . -f 1)" = 27
          test "$(uname -m)" = arm64
      - name: Build Windows releases with the static C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'CARGO_BUILD_TARGET=x86_64-pc-windows-msvc' >> $env:GITHUB_ENV
          'RUSTFLAGS=-C target-feature=+crt-static' >> $env:GITHUB_ENV
          "PREFLIGHT_BINARY=$env:GITHUB_WORKSPACE/target/x86_64-pc-windows-msvc/release/preflight.exe" >> $env:GITHUB_ENV
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: jq --version
        shell: bash
      - run: cargo fmt --all --check
      - run: cargo clippy --release --locked --workspace --all-targets --keep-going -- -D warnings
      - run: cargo test --release --locked --workspace --no-fail-fast
        if: ${{ !cancelled() }}
      - id: build
        run: cargo build --release --locked --workspace
        if: ${{ !cancelled() }}
      - run: node --test crates/preflight-client/tests/*.test.mjs
        if: ${{ !cancelled() }}
        shell: bash
      - run: sh scripts/test-script-entrypoints.sh
        if: ${{ !cancelled() }}
        shell: bash
      - id: package
        name: Package server with required Web UI and MCP
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          sh scripts/release.sh package --server "${PREFLIGHT_BINARY:-target/release/preflight$suffix}" --destination dist
      - run: sh scripts/test-without-node.sh dist
        if: ${{ !cancelled() && runner.os != 'Windows' && steps.package.outcome == 'success' }}
      - name: Install and start native Windows package
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          ./scripts/test-windows-package.ps1 -Packages dist
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/test-windows-package.ps1 -Packages dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 package acceptance failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.macos27_only }}
        with:
          name: preflight-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
