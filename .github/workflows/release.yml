name: Draft release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      include_deferred: false
  draft:
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: preflight-*
          path: artifacts
      - name: Verify release files and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p .validation
          archive=$(find artifacts -name '*-linux-aarch64.tar.gz')
          sh scripts/lib/extract-release-binary.sh "$archive" .validation/preflight
          PREFLIGHT_BINARY="$PWD/.validation/preflight" sh scripts/release-files.sh artifacts release-assets "$RELEASE_TAG"
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "Preflight $RELEASE_TAG" --notes-file release-assets/RELEASE_NOTES.md release-assets/*tar.gz release-assets/*sha256 release-assets/*.zip release-assets/*.rb release-assets/install.sh release-assets/install-preflight.sh release-assets/SHA256SUMS
