name: Check published installers
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable release tag or latest'
        type: string
        default: latest
permissions:
  contents: read
jobs:
  install:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04-arm, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PREFLIGHT_VERSION: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check published curl installer and native UI/MCP
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/check-release-install.sh "$PREFLIGHT_VERSION"
      - name: Check published Windows installer and native UI/MCP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PREFLIGHT_VERSION
          if ($version -eq 'latest') { $version = gh api repos/MaxLaneDev/preflight/releases/latest --jq .tag_name }
          if ($version -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid stable release tag.' }
          $temporary = Join-Path $env:RUNNER_TEMP ('preflight-network-' + [guid]::NewGuid())
          [void][IO.Directory]::CreateDirectory($temporary)
          try {
            gh release download $version --repo MaxLaneDev/preflight --pattern install.ps1 --pattern '*-windows-x86_64.tar.gz*' --dir $temporary
            if ($LASTEXITCODE -ne 0) { throw 'Release assets unavailable.' }
            $prefix = Join-Path $temporary 'installation'
            $receipt = (& "$temporary/install.ps1" -Version $env:PREFLIGHT_VERSION -Prefix $prefix -Config "$temporary/settings/preflight.toml" -Data "$temporary/data") | ConvertFrom-Json
            $installedVersion = (& $receipt.binary --version) | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $installedVersion.version -cne $version.Substring(1)) { throw 'Wrong installed version.' }
            Copy-Item -LiteralPath $receipt.binary -Destination "$temporary/verifier.exe"
            $env:PREFLIGHT_BINARY = "$temporary/verifier.exe"
            ./scripts/test-windows-package.ps1 -Packages $temporary -Installer "$temporary/install.ps1"
            & "$temporary/verifier.exe" package uninstall --prefix $prefix
            if ($LASTEXITCODE -ne 0) { throw 'Cannot remove isolated network installation.' }
          } finally {
            Remove-Item -LiteralPath $temporary -Recurse -Force
          }
